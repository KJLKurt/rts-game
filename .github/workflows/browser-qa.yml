name: Isolated browser acceptance
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out evidence recovery only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover complete failed preview gate without running browsers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontier-preview-layout-1bdc346c7744924d959326508629e2906325b9f5
          run-id: 38002426925
          github-token: ${{ github.token }}
          path: .qa-original
      - name: Verify all original files and split bounded complete evidence
        run: python3 .qa-preserve-original.py
      - name: Preserve readable failure review without repeating test execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-review
          path: original-review/
          retention-days: 7
      - name: Preserve complete original evidence part 1 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-0
          path: |
            original-evidence-parts/original-part-0.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 2 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-1
          path: |
            original-evidence-parts/original-part-1.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 3 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-2
          path: |
            original-evidence-parts/original-part-2.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 4 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-3
          path: |
            original-evidence-parts/original-part-3.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 5 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-4
          path: |
            original-evidence-parts/original-part-4.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 6 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-5
          path: |
            original-evidence-parts/original-part-5.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 7 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-6
          path: |
            original-evidence-parts/original-part-6.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7
      - name: Preserve complete original evidence part 8 of 8
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-original-part-7
          path: |
            original-evidence-parts/original-part-7.zip
            original-evidence-parts/original-content-manifest.json
            original-evidence-parts/restore-original.py
          compression-level: 0
          retention-days: 7

name: Isolated browser acceptance

# Deliberately separate from routine source pushes and Pages deployments.
# Move this dedicated branch only for a reviewed acceptance checkpoint.
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRONTIER_TEST_WORKERS: "2"
    steps:
      - name: Check out the acceptance checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the production PWA on desktop and touch viewports
        run: npm run test:browser -- --config playwright-mythic-qa.config.ts
      - name: Preserve browser results and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-browser-acceptance-${{ github.sha }}
          path: |
            playwright-report/
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/error-context.md
          retention-days: 2

name: Isolated browser acceptance

# One reviewed checkpoint on a dedicated branch. No deployment permissions.
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTIER_TEST_WORKERS: "2"
      FRONTIER_PREVIOUS_DIST: .qa-previous/dist
      FRONTIER_EXPECT_BUILD_ID: fc-3dce7db7d71b
    steps:
      - name: Check out the acceptance checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check out the exact previous live Space release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f9378101770085bae49d8b2ebdc21eb0edf86770
          path: .qa-previous
          persist-credentials: false
      - name: Build and verify all 82 previous-live runtime files
        run: |
          ln -s ../node_modules .qa-previous/node_modules
          npm --prefix .qa-previous run build
          node .qa-verify-previous.mjs
      - name: Build and verify all 83 frozen candidate files
        run: |
          npm run build
          node .qa-verify-candidate.mjs
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all 27 focused learning identities once
        run: npx playwright test --config playwright-learning-qa.config.ts
      - name: Sequentially verify the exact previous-live cache upgrade
        run: npx playwright test --config playwright-space-upgrade.config.ts
      - name: Verify tested distribution still matches the frozen candidate
        if: ${{ !cancelled() }}
        run: node .qa-verify-candidate.mjs
      - name: Preserve all ledgers, boundary geometry, screenshots, and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-learning-acceptance-${{ github.sha }}
          path: |
            learning-identity-ledger.json
            space-upgrade-identity-ledger.json
            previous-live-dist-proof.json
            candidate-dist-proof.json
            learning-report/
            space-upgrade-report/
            test-results-learning/
            test-results-space-upgrade/
          retention-days: 7

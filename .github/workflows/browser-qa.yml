name: Isolated browser acceptance
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTIER_PREVIOUS_DIST: .qa-previous/dist
      FRONTIER_EXPECT_BUILD_ID: fc-41ff83f832fe
    steps:
      - name: Check out reviewed workshop preview layout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check out exact current live rally and workshop release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 43d4dad361c2e32f14ecd092c3a1c74ed8553fbc
          path: .qa-previous
          persist-credentials: false
      - name: Build and verify all previous-live production bytes
        run: |
          ln -s ../node_modules .qa-previous/node_modules
          npm --prefix .qa-previous run build
          node .qa-verify-dist.mjs .qa-previous/dist .qa-previous-dist.json previous-live-dist-proof.json
      - name: Build and verify all frozen candidate production bytes
        run: |
          npm run build
          node .qa-verify-dist.mjs dist .qa-candidate-dist.json candidate-dist-proof.json
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve and verify one intended baseline portrait overlap failure
        run: |
          set +e
          npx playwright test --config playwright-preview-layout-red.config.ts
          status=$?
          set -e
          node .qa-assert-red.mjs "$status"
      - name: Verify preview round trips and ordinary HUD regressions across four views
        run: npx playwright test --config playwright-preview-layout-qa.config.ts
      - name: Sequential exact-live update and one-time paid work completion
        run: npx playwright test --config playwright-preview-layout-upgrade.config.ts
      - name: Verify both tested distributions remained byte-exact
        if: ${{ !cancelled() }}
        run: |
          node .qa-verify-dist.mjs .qa-previous/dist .qa-previous-dist.json previous-live-dist-proof.json
          node .qa-verify-dist.mjs dist .qa-candidate-dist.json candidate-dist-proof.json
      - name: Preserve all native failures, passes, traces and exclusions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-preview-layout-${{ github.sha }}
          path: |
            preview-layout-red-ledger.json
            preview-layout-red-proof.json
            preview-layout-identity-ledger.json
            preview-layout-upgrade-ledger.json
            previous-live-dist-proof.json
            candidate-dist-proof.json
            preview-layout-red-report/
            preview-layout-report/
            preview-layout-upgrade-report/
            test-results-preview-layout-red/
            test-results-preview-layout/
            test-results-preview-layout-upgrade/
          retention-days: 7

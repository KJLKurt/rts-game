name: Isolated browser acceptance
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact current-production reproduction checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify all 83 unchanged current-production files
        run: |
          npm run build
          node .qa-verify-current.mjs
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Record three focused baseline UI reproductions without retries
        run: npx playwright test --config playwright-planning-repro.config.ts
      - name: Verify tested production remained byte-exact
        if: ${{ !cancelled() }}
        run: node .qa-verify-current.mjs
      - name: Preserve all first-attempt failures, screenshots, ledgers and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-planning-reproduction-${{ github.sha }}
          path: |
            planning-repro-identity-ledger.json
            current-live-dist-proof.json
            planning-repro-report/
            test-results-planning-repro/
          retention-days: 7

name: Isolated browser acceptance

# Deliberately separate from routine source pushes and Pages deployments.
# Move this dedicated branch only for a reviewed acceptance checkpoint.
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRONTIER_TEST_WORKERS: "2"
      FRONTIER_PREVIOUS_DIST: .qa-previous/dist
      FRONTIER_EXPECT_BUILD_ID: fc-7592049128ac
    steps:
      - name: Check out the acceptance checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check out the exact current live rollback for upgrade acceptance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b8029a43e7a21e06b381bfd190689242798fd4a3
          path: .qa-previous
          persist-credentials: false
      - name: Build and verify the exact previous live runtime
        run: |
          ln -s ../node_modules .qa-previous/node_modules
          npm --prefix .qa-previous run build
          node .qa-verify-previous.mjs
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Continue only three Space crowd identities after camera-follow setup correction
        run: npx playwright test --config playwright-space-qa.config.ts
      - name: Sequentially verify the exact previous-live cache upgrade
        run: npx playwright test --config playwright-space-upgrade.config.ts
      - name: Preserve browser results and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontier-browser-acceptance-${{ github.sha }}
          path: |
            space-identity-ledger.json
            space-upgrade-identity-ledger.json
            previous-live-dist-proof.json
            space-report/
            space-upgrade-report/
            test-results-space/**/*.png
            test-results-space/**/error-context.md
            test-results-space-upgrade/**/*.png
            test-results-space-upgrade/**/*.json
            test-results-space-upgrade/**/error-context.md
          retention-days: 2


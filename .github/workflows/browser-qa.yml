name: Isolated browser acceptance
on:
  push:
    branches: [qa-browser-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-command-browser-qa
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTIER_PREVIOUS_DIST: .qa-previous/dist
      FRONTIER_EXPECT_BUILD_ID: fc-f9ca19483611
    steps:
      - name: Check out reviewed rally and workshop candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check out exact current live planning release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: febfa91d644a6576e98a5dede8ffc452ae176829
          path: .qa-previous
          persist-credentials: false
      - name: Build and verify all previous-live production bytes
        run: |
          ln -s ../node_modules .qa-previous/node_modules
          npm --prefix .qa-previous run build
          node .qa-verify-dist.mjs .qa-previous/dist .qa-previous-dist.json previous-live-dist-proof.json
      - name: Build and verify all frozen candidate production bytes
        run: |
          npm run build
          node .qa-verify-dist.mjs dist .qa-candidate-dist.json candidate-dist-proof.json
      - name: Install official Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve and verify two intended baseline native failures
        run: |
          set +e
          npx playwright test --config playwright-rally-workshop-red.config.ts
          status=$?
          set -e
          node .qa-assert-red.mjs "$status"
      - name: Verify fixed boundaries and affected regressions across desktop and phone views
        run: npx playwright test --config playwright-rally-workshop-qa.config.ts
      - name: Sequential exact-live update and one-time paid work completion
        run: npx playwright test --config playwright-rally-workshop-upgrade.config.ts
      - name: Verify both tested distributions remained byte-exact
        if: ${{ !cancelled() }}
        run: |
          node .qa-verify-dist.mjs .qa-previous/dist .qa-previous-dist.json previous-live-dist-proof.json
          node .qa-verify-dist.mjs dist .qa-candidate-dist.json candidate-dist-proof.json
      - name: Preserve all native failures, passes, traces and exclusions
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontier-rally-workshop-${{ github.sha }}
          path: |
            rally-workshop-red-ledger.json
            rally-workshop-red-proof.json
            rally-workshop-identity-ledger.json
            rally-workshop-upgrade-ledger.json
            previous-live-dist-proof.json
            candidate-dist-proof.json
            rally-workshop-red-report/
            rally-workshop-report/
            rally-workshop-upgrade-report/
            test-results-rally-workshop-red/
            test-results-rally-workshop/
            test-results-rally-workshop-upgrade/
          retention-days: 7
